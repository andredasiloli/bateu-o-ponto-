<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bateu o ponto? ⏰</title>
<style>
  :root{
    --bg:#10233a; --panel:#183452; --ink:#f3f0e6; --mute:#9db4cc;
    --sun:#ffc93c; --out:#ff7a59; --ok:#5fd6a0; --warn:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1f4a73,var(--bg));
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex;justify-content:center;padding:20px 14px 40px;
  }
  main{width:100%;max-width:460px;text-align:center}
  h1{font-size:1.7rem;margin:.2em 0 .1em;letter-spacing:-.01em}
  .sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}

  #dial{width:100%;max-width:340px;touch-action:none;user-select:none;cursor:grab}
  #dial:active{cursor:grabbing}
  .lbl{font-size:11px;font-weight:700;fill:#0d1b2e;paint-order:stroke;stroke:rgba(255,255,255,.55);stroke-width:2.5px}
  .lbl.n{fill:#fff;stroke:rgba(0,0,30,.6)}
  #hIn{filter:drop-shadow(0 0 6px rgba(255,201,60,.9))}

  .times{display:flex;gap:10px;margin:14px 0 6px}
  .box{flex:1;background:var(--panel);border-radius:16px;padding:12px 8px}
  .box small{display:block;color:var(--mute);font-size:.8rem;margin-bottom:2px}
  .box b{font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1.1}
  .box.in b{color:var(--sun)} .box.out b{color:var(--out)}
  .box em{display:block;font-style:normal;font-size:.75rem;color:var(--mute);min-height:1em}

  .say{background:var(--panel);border-radius:16px;padding:12px 14px;margin:8px 0;text-align:left;
       border-left:5px solid var(--sun);min-height:3.2em;display:flex;align-items:center}
  .say.out{border-left-color:var(--out)}
  .say.pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}

  .saldo{margin:10px 0;font-size:.95rem;color:var(--mute)}
  .saldo strong.ok{color:var(--ok)} .saldo strong.warn{color:var(--warn)}

  .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  button,input,select{
    font:inherit;color:var(--ink);background:var(--panel);border:2px solid #2a5079;
    border-radius:12px;padding:9px 12px;
  }
  button{cursor:pointer;font-weight:700}
  button:hover{border-color:var(--sun)}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  #left{margin-top:14px;font-size:.95rem;color:var(--mute);min-height:1.4em}
  #left b{color:var(--ink)}

  details{background:var(--panel);border-radius:16px;margin-top:18px;text-align:left;padding:4px 14px}
  summary{cursor:pointer;padding:10px 0;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0 12px}
  .grid label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mute)}
  .grid input,.grid select{width:100%;background:var(--bg)}
  .grid .full{grid-column:1/-1}
  .resumo{grid-column:1/-1;font-size:.9rem;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px}
  @media (prefers-reduced-motion:reduce){.say.pop{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Bateu o ponto? ⏰</h1>
  <p class="sub">Arraste o ponteiro amarelo até a hora que você entrou.<br><span id="jornada"></span></p>

  <svg id="dial" viewBox="0 0 300 300" role="img" aria-label="Relógio de 24 horas">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fdcff"/><stop offset=".5" stop-color="#5a8fd0"/>
        <stop offset="1" stop-color="#15213f"/>
      </linearGradient>
    </defs>
    <circle cx="150" cy="150" r="138" fill="url(#sky)" stroke="#2a5079" stroke-width="4"/>
    <g id="ticks"></g>
    <path id="arc" fill="none" stroke="rgba(255,122,89,.85)" stroke-width="10" stroke-linecap="round"/>
    <line id="hOut" x1="150" y1="150" x2="150" y2="50" stroke="#ff7a59" stroke-width="4" stroke-linecap="round"/>
    <circle id="dOut" r="9" fill="#ff7a59" stroke="#fff" stroke-width="2"/>
    <line id="hIn" x1="150" y1="150" x2="150" y2="40" stroke="#ffc93c" stroke-width="6" stroke-linecap="round"/>
    <circle id="dIn" r="13" fill="#ffc93c" stroke="#fff" stroke-width="3"/>
    <circle cx="150" cy="150" r="6" fill="#fff"/>
    <text x="150" y="105" text-anchor="middle" font-size="26">☀️</text>
    <text x="150" y="210" text-anchor="middle" font-size="22">🌙</text>
  </svg>

  <div class="times">
    <div class="box in"><small>Entrada</small><b id="tIn">--:--</b><em id="eIn"></em></div>
    <div class="box out"><small>Pode sair às</small><b id="tOut">--:--</b><em id="eOut"></em></div>
  </div>

  <div class="say" id="mIn">Arraste o relógio…</div>
  <div class="say out" id="mOut">…que eu digo a hora de vazar.</div>
  <div class="saldo" id="saldo"></div>
  <div id="left"></div>

  <div class="ctl">
    <button id="btnNow">Entrei agora</button>
    <button id="btnStd">Horário padrão</button>
    <input type="time" id="manual" step="60" aria-label="Digitar horário de entrada">
  </div>

  <details id="cfg">
    <summary>⚙️ Personalizar jornada</summary>
    <div class="grid">
      <label>Escala
        <select id="cEscala">
          <option value="5">5x2 (5 dias de trabalho)</option>
          <option value="6">6x1 (6 dias de trabalho)</option>
        </select>
      </label>
      <label>Carga semanal
        <select id="cSemana">
          <option value="44">44 horas</option>
          <option value="40">40 horas</option>
          <option value="0">Personalizada…</option>
        </select>
      </label>
      <label class="full" id="lblCustom" hidden>Horas por semana
        <input type="number" id="cCustom" min="1" max="60" step="0.5" value="42">
      </label>
      <label>Intervalo (minutos)
        <input type="number" id="cAlmoco" min="0" max="240" step="5" value="60">
      </label>
      <label>Entrada padrão
        <input type="time" id="cEntrada" value="09:00">
      </label>
      <div class="resumo" id="resumo"></div>
    </div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); };
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const hm = m => { m = Math.round(m); return `${Math.floor(m / 60)}h${pad(m % 60)}`; };

/* ---------- Frases ---------- */
const ENTRY = {
  madrugada: ["Caiu da cama, foi? 🛏️⬇️","O galo ainda estava no primeiro café. 🐓","Você é o zelador ou o funcionário? 🔑","A empresa nem acendeu as luzes ainda. 💡"],
  cedo: ["Olha o pontual! Quem madruga, Deus ajuda... e o banco de horas também. ⏰","Acordou com o pé direito (e o esquerdo também). 🦶","Chegou cedo pra pegar o melhor lugar do café. ☕","Alguém dormiu cedo ontem, hein? 😇"],
  pontual: ["Britânico de tão pontual. 🎩","Nem um minuto a mais, nem a menos. Cirúrgico. 🎯","Horário padrão. O RH te ama. 💘"],
  atrasado: ["Dormiu aí, né? 😴","O despertador tocou. Você que não ouviu. 🔔","Só mais cinco minutinhos... que viraram cinquenta. 🛌","O trânsito, claro. Foi o trânsito. Sempre é. 🚗"],
  muito_atrasado: ["Vai dormir aí mesmo, já que veio até aqui. 🛏️","Chegou junto com o almoço, parabéns! 🍽️","O travesseiro mandou um abraço. 🫂","Isso é entrada ou já é o lanche da tarde? 🥪"]
};
const EXIT = {
  sol: ["Deu pra ver o sol hoje! 🌞","Saiu com luz do dia, que luxo! 😎","Vai aproveitar a vida lá fora, cidadão! 🌳"],
  normal: ["Saída padrão. Sem drama, sem hora extra. ✅","Bateu, saiu, viveu. 🚪","Tudo certo, missão cumprida! 🫡"],
  tarde: ["Já já dorme na empresa, hein? 🏢🌙","Saiu de noite... dá até pra jantar no escritório. 🍕","A faxineira já te conhece pelo nome. 🧹"],
  madrugada: ["Você mora aí? Manda o endereço pra correspondência. 📮","Isso é saída ou um novo turno? 🦉","Até o segurança já vai te chamar de colega. 👮"]
};
const pick = a => a[Math.floor(Math.random() * a.length)];
const clsEntry = d => d <= -90 ? "madrugada" : d < -15 ? "cedo" : d <= 15 ? "pontual" : d <= 60 ? "atrasado" : "muito_atrasado";
const clsExit = m => m >= 1440 || m >= 21 * 60 ? "madrugada" : m >= 19 * 60 + 30 ? "tarde" : m < 18 * 60 ? "sol" : "normal";

/* ---------- Configuração (salva no navegador) ---------- */
const DEF = { dias: 5, semana: 44, custom: 42, almoco: 60, entrada: "09:00" };
let cfg = { ...DEF };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("ponto-cfg") || "{}")); } catch (_) {}

const semanal = () => cfg.semana === 0 ? cfg.custom : cfg.semana;
const duration = () => Math.round(semanal() * 60 / cfg.dias + cfg.almoco); // min de entrada até saída
const stdIn = () => toMin(cfg.entrada);
const stdOut = () => stdIn() + duration();

function readCfg() {
  cfg.dias = +$("cEscala").value;
  cfg.semana = +$("cSemana").value;
  cfg.custom = Math.min(60, Math.max(1, +$("cCustom").value || DEF.custom));
  cfg.almoco = Math.min(240, Math.max(0, +$("cAlmoco").value || 0));
  cfg.entrada = $("cEntrada").value || DEF.entrada;
  try { localStorage.setItem("ponto-cfg", JSON.stringify(cfg)); } catch (_) {}
}
function writeCfg() {
  $("cEscala").value = cfg.dias; $("cSemana").value = cfg.semana;
  $("cCustom").value = cfg.custom; $("cAlmoco").value = cfg.almoco; $("cEntrada").value = cfg.entrada;
}
function refreshLabels() {
  $("lblCustom").hidden = cfg.semana !== 0;
  const trab = semanal() * 60 / cfg.dias;
  $("resumo").innerHTML = `${cfg.dias}x${7 - cfg.dias} · ${semanal()}h/semana → <b>${hm(trab)}</b> de trabalho por dia + ${cfg.almoco} min de intervalo = <b>${hm(duration())}</b> no local.`;
  $("jornada").innerHTML = `Jornada: <b>${hm(duration())}</b> · padrão ${cfg.entrada} → ${fmt(stdOut())}`;
}

/* ---------- Relógio ---------- */
const C = 150, R_IN = 100, R_OUT = 88, R_TICK = 138;
const ang = m => (m / 1440) * 360 + 180;
const pt = (m, r) => { const a = ang(m) * Math.PI / 180; return [C + r * Math.sin(a), C - r * Math.cos(a)]; };

(function ticks() {
  let s = "";
  for (let h = 0; h < 24; h++) {
    const [x1, y1] = pt(h * 60, R_TICK - (h % 3 ? 6 : 12)), [x2, y2] = pt(h * 60, R_TICK - 1);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${h < 6 || h >= 18 ? "#cfe" : "#0d1b2e"}" stroke-width="${h % 3 ? 1 : 2.5}" opacity=".8"/>`;
    if (h % 3 === 0) {
      const [tx, ty] = pt(h * 60, R_TICK - 24);
      s += `<text class="lbl ${h < 6 || h >= 18 ? "n" : ""}" x="${tx}" y="${ty + 4}" text-anchor="middle">${h}h</text>`;
    }
  }
  $("ticks").innerHTML = s;
})();

let entry = stdIn(), dragging = false;

function say(el, txt) {
  if (el.textContent === txt) return;
  el.textContent = txt; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

let lastKey = "";
function draw() {
  const D = duration(), x = entry + D;
  const [ix, iy] = pt(entry, R_IN), [ox, oy] = pt(x, R_OUT);
  $("hIn").setAttribute("x2", ix); $("hIn").setAttribute("y2", iy);
  $("dIn").setAttribute("cx", ix); $("dIn").setAttribute("cy", iy);
  $("hOut").setAttribute("x2", ox); $("hOut").setAttribute("y2", oy);
  $("dOut").setAttribute("cx", ox); $("dOut").setAttribute("cy", oy);
  const [ax, ay] = pt(entry, R_OUT), [bx, by] = pt(x, R_OUT);
  $("arc").setAttribute("d", `M${ax} ${ay} A${R_OUT} ${R_OUT} 0 ${D > 720 ? 1 : 0} 1 ${bx} ${by}`);
  $("tIn").textContent = fmt(entry);
  $("manual").value = fmt(entry);
  $("tOut").textContent = fmt(x);

  const dl = entry - stdIn(), sd = x - stdOut();
  $("eIn").textContent = dl === 0 ? "no horário" : `${Math.abs(dl)} min ${dl < 0 ? "antes" : "depois"} do padrão`;
  $("eOut").textContent = x >= 1440 ? "(dia seguinte 😬)" : sd === 0 ? "igual à saída padrão" : `${Math.abs(sd)} min ${sd < 0 ? "antes" : "depois"} da padrão`;
  $("saldo").innerHTML = sd > 0
    ? `Sair depois de ${fmt(stdOut())} = <strong class="warn">hora extra!</strong> 🚨`
    : `Sem hora extra: <strong class="ok">${sd === 0 ? "na medida" : "sobra " + Math.abs(sd) + " min de vida"}</strong> 🎉`;

  // só sorteia frase nova quando a faixa muda
  const ek = clsEntry(dl), xk = clsExit(x);
  if (lastKey !== ek + xk) {
    lastKey = ek + xk;
    say($("mIn"), pick(ENTRY[ek])); say($("mOut"), pick(EXIT[xk]));
  }
}
function update() { refreshLabels(); draw(); }

function fromEvent(ev) {
  const r = $("dial").getBoundingClientRect();
  const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
  let deg = Math.atan2(dx, -dy) * 180 / Math.PI; if (deg < 0) deg += 360;
  return Math.round((((deg - 180 + 360) % 360) / 360 * 1440) / 5) * 5 % 1440;
}
$("dial").addEventListener("pointerdown", e => { dragging = true; $("dial").setPointerCapture(e.pointerId); entry = fromEvent(e); draw(); });
$("dial").addEventListener("pointermove", e => { if (dragging) { entry = fromEvent(e); draw(); } });
["pointerup", "pointercancel"].forEach(t => $("dial").addEventListener(t, () => dragging = false));

$("manual").addEventListener("change", e => { if (e.target.value) { entry = toMin(e.target.value); draw(); } });
$("btnStd").onclick = () => { entry = stdIn(); draw(); };
$("btnNow").onclick = () => { const n = new Date(); entry = n.getHours() * 60 + n.getMinutes(); draw(); };

["cEscala", "cSemana", "cCustom", "cAlmoco", "cEntrada"].forEach(id =>
  $(id).addEventListener("change", () => {
    const oldStd = stdIn(), wasStd = entry === oldStd;
    readCfg();
    if (wasStd) entry = stdIn();   // se estava no padrão, acompanha a nova entrada padrão
    lastKey = ""; update();
  }));

setInterval(() => {
  const n = new Date(), diff = entry + duration() - (n.getHours() * 60 + n.getMinutes());
  $("left").innerHTML = (diff > 0 && diff <= duration())
    ? `Faltam <b>${hm(diff)}</b> pra você ser livre 🕊️` : "";
}, 1000);

writeCfg(); entry = stdIn(); update();
</script>
</body>
</html>
